<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Banner: Shanudha Tirosh, Building Ideas into Reality.">
  <title>Shanudha Tirosh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#14151f"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".20"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c0caf5" fill-opacity=".07"/></pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="960" cy="150" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="900;1020;900" dur="16s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </circle>
    <g>
      <rect x="880" y="44" width="250" height="150" rx="20" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
      <rect x="860" y="74" width="250" height="150" rx="20" fill="#2a2f4a" stroke="#565f89" stroke-width="2"/>
      <rect x="840" y="104" width="250" height="150" rx="20" fill="url(#top)"/>
      <circle cx="872" cy="136" r="9" fill="#1a1b26" fill-opacity=".85"/>
      <rect x="892" y="130" width="120" height="12" rx="6" fill="#1a1b26" fill-opacity=".85"/>
      <rect x="862" y="166" width="190" height="10" rx="5" fill="#1a1b26" fill-opacity=".55"/>
      <rect x="862" y="188" width="150" height="10" rx="5" fill="#1a1b26" fill-opacity=".55"/>
      <rect x="862" y="210" width="90" height="10" rx="5" fill="#1a1b26" fill-opacity=".55"/>
    </g>
    <text x="64" y="150" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#c0caf5">Shanudha Tirosh</text>
    <rect x="68" y="182" width="64" height="5" rx="2.5" fill="#7aa2f7"/>
    <text x="66" y="236" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="600" fill="#7aa2f7">Building Ideas into Reality.</text>
  </g>
</svg>
